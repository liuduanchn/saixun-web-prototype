<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">赛训智舱 —— AI 驱动的职业技能竞赛备赛智能体</title>
  <desc id="heroDesc">深海军蓝底色。左侧为项目名称「赛训智舱」、口号「让备赛有标准，让答辩有底气」与一句话说明；右上角为品牌标识「闭环驱动」（开口圆环加品红箭头）；底部为自赛项理解至赛后复盘的六阶段备赛轨道，前三阶段标记为已完成，第四阶段「作品打磨」为当前阶段。</desc>

  <rect width="1200" height="460" rx="24" fill="#03132b"/>

  <g id="brand-mark" transform="translate(1000 72) scale(0.6)">
    <path d="M178.3 98.8 A62 62 0 1 1 141.2 61.7" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <rect x="103" y="103" width="34" height="34" rx="10" fill="#EE4C86"/>
    <polygon points="-9,-9 11,0 -9,9" transform="translate(163.8 76.2) rotate(45)" fill="#EE4C86"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" transform="translate(64 78)">
    <text y="0" font-size="20" fill="#9eb2ce" letter-spacing="4">职业教育 · 竞赛备赛智能体</text>
    <text y="80" font-size="72" font-weight="700" fill="#f4f8ff" letter-spacing="2">赛训智舱</text>
    <text y="128" font-size="28" fill="#1683ff">让备赛有标准，让答辩有底气</text>
    <text y="168" font-size="21" fill="#9eb2ce">从赛项规程到赛后复盘，把备赛的每一步都落在标准与证据上</text>
  </g>

  <g id="tech-chips" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9eb2ce">
    <rect x="64" y="254" width="118" height="34" rx="17" fill="#071d3c" stroke="#1d426d"/>
    <text x="82" y="277">React 19</text>
    <rect x="194" y="254" width="128" height="34" rx="17" fill="#071d3c" stroke="#1d426d"/>
    <text x="212" y="277">NestJS 11</text>
    <rect x="334" y="254" width="118" height="34" rx="17" fill="#071d3c" stroke="#1d426d"/>
    <text x="352" y="277">Prisma 6</text>
    <rect x="464" y="254" width="97" height="34" rx="17" fill="#071d3c" stroke="#1d426d"/>
    <text x="482" y="277">SQLite</text>
  </g>

  <g id="stage-rail">
    <rect x="40" y="312" width="1120" height="120" rx="16" fill="#071d3c" stroke="#1d426d"/>

    <line x1="500" y1="364" x2="1100" y2="364" stroke="#1d426d" stroke-width="2" stroke-dasharray="6 8"/>
    <line x1="100" y1="364" x2="500" y2="364" stroke="#67db75" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">
      <circle cx="100" cy="364" r="22" fill="#071d3c" stroke="#67db75" stroke-width="2.5"/>
      <text x="100" y="370" fill="#67db75">1</text>
      <circle cx="300" cy="364" r="22" fill="#071d3c" stroke="#67db75" stroke-width="2.5"/>
      <text x="300" y="370" fill="#67db75">2</text>
      <circle cx="500" cy="364" r="22" fill="#071d3c" stroke="#67db75" stroke-width="2.5"/>
      <text x="500" y="370" fill="#67db75">3</text>
      <circle cx="700" cy="364" r="22" fill="#176dca" stroke="#1683ff" stroke-width="2.5"/>
      <text x="700" y="370" fill="#f4f8ff">4</text>
      <circle cx="900" cy="364" r="22" fill="#071d3c" stroke="#1d426d" stroke-width="2.5"/>
      <text x="900" y="370" fill="#9eb2ce">5</text>
      <circle cx="1100" cy="364" r="22" fill="#071d3c" stroke="#1d426d" stroke-width="2.5"/>
      <text x="1100" y="370" fill="#9eb2ce">6</text>
    </g>

    <circle cx="700" cy="364" r="31" fill="none" stroke="#EE4C86" stroke-width="2" opacity="0.85"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" fill="#9eb2ce">
      <text x="100" y="414">赛项理解</text>
      <text x="300" y="414">方案设计</text>
      <text x="500" y="414">原型开发</text>
      <text x="700" y="414" fill="#f4f8ff" font-weight="600">作品打磨</text>
      <text x="900" y="414">模拟答辩</text>
      <text x="1100" y="414">赛后复盘</text>
    </g>
  </g>
</svg>
